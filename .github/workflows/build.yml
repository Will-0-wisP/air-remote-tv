name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build debug APKs (phone + TV)
        run: gradle assemblePhoneDebug assembleTvDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/phone/debug/app-phone-debug.apk dist/fire-air-mouse-phone-debug.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk dist/fire-air-mouse-tv-debug.apk

      - uses: actions/upload-artifact@v6
        with:
          name: fire-air-mouse-debug-apks
          path: dist/*.apk
