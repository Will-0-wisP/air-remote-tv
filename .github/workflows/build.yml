name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APKs (phone + TV)
        run: gradle assemblePhoneDebug assembleTvDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/phone/debug/app-phone-debug.apk dist/fire-air-mouse-phone-debug.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk dist/fire-air-mouse-tv-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fire-air-mouse-debug-apks
          path: dist/*.apk
